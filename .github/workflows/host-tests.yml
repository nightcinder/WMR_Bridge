name: host-tests

on:
  # Branch pushes stay on `main`: without this every branch push produced a
  # second `host-tests` check alongside the pull_request one.
  push:
    branches: [main]
  pull_request:

jobs:
  # The same C suite with the address and undefined-behaviour sanitizers. The
  # plain job stays the fast one; this one proves the host tests stay inside
  # their buffers and do not trip UB on the paths they cover. No suppression
  # flags: a finding is a finding.
  host-tests-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run host C tests under ASan and UBSan
        env:
          CFLAGS: -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -g
        run: ./tests/run_c_tests.sh

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run host C tests
        run: ./tests/run_c_tests.sh
      - name: Run capture/analysis script tests
        run: python3 tests/test_analyze_capture.py
      - name: Run tester-bundle triage tests
        run: python3 -m unittest tests.test_triage_bundle -v
      - name: Run docs/GATT property tests
        run: python3 tests/test_doc_gatt.py
      - name: Run docs link checks
        run: python3 tests/test_docs_links.py
      - name: Run Linux/Pi host-bridge tests
        working-directory: pi
        run: python3 -m unittest discover -s tests -v
      - name: Pi package and daemon dry run
        run: ./pi/tools/dry_run.sh
      - name: Run firmware packaging tests
        run: python3 tests/test_firmware_package.py
      - name: Run firmware size budget tests
        run: python3 tests/test_firmware_size.py
