name: host-tests

on:
  # Branch pushes stay on `main`: without this every branch push produced a
  # second `host-tests` check alongside the pull_request one.
  push:
    branches: [main]
  pull_request:

jobs:
  # The same C suite with the address and undefined-behaviour sanitizers. The
  # plain job stays the fast one; this one proves the host tests stay inside
  # their buffers and do not trip UB on the paths they cover. No suppression
  # flags: a finding is a finding.
  host-tests-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run host C tests under ASan and UBSan
        env:
          CFLAGS: -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -g
        run: ./tests/run_c_tests.sh

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run host C tests
        run: ./tests/run_c_tests.sh
      - name: Build the wmr_codec target and run ctest
        run: cmake -B build && cmake --build build && ctest --test-dir build --output-on-failure
      - name: Run capture/analysis script tests
        run: python3 tests/test_analyze_capture.py
      - name: Run tester-bundle triage tests
        run: python3 -m unittest tests.test_triage_bundle -v
      - name: Run docs/GATT property tests
        run: python3 tests/test_doc_gatt.py
      - name: Run GATT encryption key-size tests
        run: python3 tests/test_gatt_encryption.py
      - name: Run docs link checks
        run: python3 tests/test_docs_links.py
      - name: Install the Pi BLE D-Bus and release-signing test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dbus-next minisign
      - name: Run Linux/Pi host-bridge tests
        working-directory: pi
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify Pi packages
        run: |
          ./pi/build_package.sh
          version="$(cd pi && python3 -c 'import wmr_bridge; print(wmr_bridge.__version__)')"
          ./pi/tools/verify_package.sh "dist/wmr-bridge-${version}.tar.gz"
          ./pi/build_deb.sh
      - name: Pi package and daemon dry run
        run: ./pi/tools/dry_run.sh
      - name: Run release checksum tests
        run: python3 tests/test_release_sums.py
      # Pull requests do not receive repository secrets, and the release key
      # must never be available to PR code, so production signing is exercised
      # only on main. This proves the configured secret signs and verifies
      # before a tag release needs it; the tag job publishes the real list.
      - name: Sign and verify a staged release checksum list
        if: github.event_name == 'push'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          rm -rf release
          mkdir -p release
          cp pi/install.sh pi/minisign.pub release/
          tools/release/make_sums.sh release
          tools/release/sign_sums.sh release
      - name: Run firmware packaging tests
        run: python3 tests/test_firmware_package.py
      - name: Run firmware size budget tests
        run: python3 tests/test_firmware_size.py
