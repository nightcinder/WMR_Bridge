name: host-tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build protocol and queue tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_protocol.c src/wmr_protocol.c src/wmr_queue.c src/wmr_decoded.c src/wmr_decode.c -o test_protocol
      - name: Build decoder tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_decode.c src/wmr_decode.c -lm -o test_decode
      - name: Build link-parameter tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_link.c src/wmr_link.c -o test_link
      - name: Build FF12 stream-mode tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_stream_mode.c src/wmr_stream_mode.c src/wmr_decoded.c src/wmr_decode.c -o test_stream_mode
      - name: Build FF14 batching tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_batch.c src/wmr_batch.c src/wmr_stream_mode.c src/wmr_queue.c src/wmr_decoded.c src/wmr_decode.c -o test_batch
      - name: Build FF15 echo tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_echo.c src/wmr_echo.c -o test_echo
      - name: Build discovery tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_discovery.c src/wmr_discovery.c -o test_discovery
      - name: Build link-diagnostics tests
        run: gcc -std=c99 -Wall -Wextra -Wconversion -Werror -Isrc tests/test_diag.c src/wmr_devloss.c src/wmr_diag.c -o test_diag
      - name: Run protocol and queue tests
        run: ./test_protocol samples/controller_frames.txt
      - name: Run decoder tests
        run: ./test_decode samples/controller_frames.txt
      - name: Run link-parameter tests
        run: ./test_link
      - name: Run FF12 stream-mode tests
        run: ./test_stream_mode samples/controller_frames.txt
      - name: Run FF14 batching tests
        run: ./test_batch
      - name: Run FF15 echo tests
        run: ./test_echo
      - name: Run discovery tests
        run: ./test_discovery
      - name: Run link-diagnostics tests
        run: ./test_diag
      - name: Run capture/analysis script tests
        run: python3 tests/test_analyze_capture.py
