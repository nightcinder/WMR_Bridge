name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No paths filter: `Build firmware` is a required check on every PR, and a
  # required check that is filtered out can never report, so the PR can never
  # merge. A docs-only PR costs one firmware build and Actions minutes are free
  # on a public repo.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and package all three variants
        env:
          IDF_PATH: /opt/esp/idf
        run: |
          . "$IDF_PATH/export.sh"
          for variant in both left right; do
            python3 tools/firmware/build.py --variant "$variant" --out dist
          done

      - name: List artifacts
        run: ls -lh dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag with a suffix (v0.1.0-rc1) is a prerelease and must not be
          # offered as "Latest"; a plain version tag (v0.1.0) is a release.
          # Without this the action leaves prerelease unset, which GitHub reads
          # as a full release — v0.1.0-rc1 was published that way and had to be
          # corrected by hand.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  pages:
    name: Deploy browser flasher
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
