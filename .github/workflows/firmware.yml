name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No paths filter: `Build firmware` is a required check on every PR, and a
  # required check that is filtered out can never report, so the PR can never
  # merge. A docs-only PR costs one firmware build and Actions minutes are free
  # on a public repo.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    # The self-hosted runner has no Docker, so this job runs directly on the
    # host and uses the ESP-IDF installation the `esp-idf` label advertises.
    runs-on: [self-hosted, liesa, esp-idf]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and package all three variants
        run: |
          set -euo pipefail
          # The runner exports idf.py when it is set up with ESP-IDF; fall back
          # to the standard install locations when it does not.
          if ! command -v idf.py >/dev/null 2>&1; then
            for script in "$HOME/esp/esp-idf/export.sh" \
                          /opt/esp/idf/export.sh \
                          /opt/esp-idf/export.sh; do
              if [ -f "$script" ]; then
                . "$script"
                break
              fi
            done
          fi
          if ! command -v idf.py >/dev/null 2>&1; then
            script=$(find "$HOME" /opt -maxdepth 4 -name export.sh \
              -path '*esp-idf*' 2>/dev/null | head -n 1 || true)
            if [ -n "$script" ]; then
              . "$script"
            fi
          fi
          command -v idf.py >/dev/null 2>&1 || {
            echo "::error::ESP-IDF is not available on this runner"
            exit 1
          }
          for variant in both left right; do
            python3 tools/firmware/build.py --variant "$variant" --out dist
          done

      - name: List artifacts
        run: ls -lh dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist
          if-no-files-found: error
          retention-days: 30

  package:
    name: Build Pi bridge packages
    # The Pi package version is independent of the firmware tag (it comes from
    # pi/wmr_bridge/__version__), so the tag does not override it. The ESP-IDF
    # build container has no dpkg-deb, hence the separate ubuntu-latest job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build tarball, .deb and release installer
        run: |
          pi/build_package.sh --out dist
          pi/build_deb.sh --out dist
          cp pi/install.sh dist/install.sh

      - name: Verify assets and checksums
        run: |
          ls -l dist
          (cd dist && sha256sum -c ./*.sha256)
          test -f dist/install.sh

      - name: Upload Pi bridge packages
        uses: actions/upload-artifact@v7
        with:
          name: pi-package
          path: dist
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Download Pi bridge packages
        uses: actions/download-artifact@v8
        with:
          name: pi-package
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # A tag with a suffix (v0.1.0-rc1) is a prerelease and must not be
          # offered as "Latest"; a plain version tag (v0.1.0) is a release.
          # Without this the action leaves prerelease unset, which GitHub reads
          # as a full release — v0.1.0-rc1 was published that way and had to be
          # corrected by hand.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  pages:
    name: Deploy browser flasher
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
