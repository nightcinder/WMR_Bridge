name: firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  # No paths filter: `Build firmware` is a required check on every PR, and a
  # required check that is filtered out can never report, so the PR can never
  # merge. A docs-only PR costs one firmware build and Actions minutes are free
  # on a public repo.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `liesa` runner is deliberately isolated: it has no Docker socket, so
  # firmware is built natively there from an ESP-IDF checkout kept in its
  # persistent volumes. Only push, tag and manual runs go to it — a pull
  # request must never execute code on that host — so PRs keep building in the
  # pinned ESP-IDF container on a GitHub-hosted runner. `Build firmware` stays
  # the required PR check.
  build:
    name: Build firmware
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    timeout-minutes: 90
    # The image enables ccache (IDF_CCACHE_ENABLE=1), but its cache lives in the
    # container, so without the steps below every run recompiles the whole
    # ESP-IDF tree from scratch: 1335 objects per variant, about two minutes
    # each. Persisting the cache between runs leaves a PR build compiling only
    # the files it touched. ccache keys on the full command line, so each
    # variant keeps its own entries (the variant defines are global
    # EXTRA_CFLAGS) and reuse is across runs of the same variant. The first push
    # of a new PR has nothing of its own to restore, so firmware-cache.yml keeps
    # a warm cache on main for it to inherit.
    env:
      # Pin the path: ccache 4.x otherwise picks $HOME/.cache/ccache.
      CCACHE_DIR: /root/.ccache
      # Well above one full build's objects; the repo cache limit is 10 GB and
      # least-recently-used entries are evicted, which is fine because a
      # partial restore still saves the bulk of the compile.
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Restore by prefix: an exact key match is rare (the key carries the
      # commit), and a cache from an earlier commit is what makes the build
      # incremental. Include the IDF image tag in the key so a toolchain bump
      # starts from an empty cache instead of reusing incompatible objects.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v6
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-idf-v6.1-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-idf-v6.1-

      - name: Build, package and check all three variants
        env:
          IDF_PATH: /opt/esp/idf
        run: |
          . "$IDF_PATH/export.sh"
          # build.py prints each variant's static DRAM and image size and fails
          # the build if either is over tools/firmware/size-budget.json.
          for variant in both left right; do
            python3 tools/firmware/build.py --variant "$variant" --out dist
          done

      - name: List artifacts
        run: ls -lh dist

      # The firmware output directory is also the Pages site. Stage what the
      # tag-time deploy publishes and assert the payload here, so the artifact
      # and its cross-links are verified on every PR instead of only on a tag.
      - name: Check the Pages payload
        run: |
          set -eu
          cp docs/flasher/index.html dist/index.html
          cp docs/flasher/pi.html dist/pi.html
          cp pi/install.sh dist/install.sh
          test -s dist/index.html
          test -s dist/pi.html
          test -s dist/install.sh
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          root = Path("dist")
          for page in ("index.html", "pi.html"):
              html = (root / page).read_text(encoding="utf-8")
              for href in re.findall(r'href="(\./[^"#?]+)"', html):
                  if not (root / href[2:]).is_file():
                      sys.exit("%s links to missing %s" % (page, href))
          print("Pages payload OK: index.html, pi.html, install.sh")
          PY

      # Package the payload with the same action the tag-time deploy uses, then
      # unpack it and assert the tar that deploy-pages downloads. The only step
      # left to a tag is the deploy call itself, which needs no PR input.
      - name: Build the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Download the Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: pages-artifact

      - name: Verify the Pages artifact
        run: |
          set -eu
          tar -tf pages-artifact/artifact.tar | sed 's|^\./||' | sort
          for f in index.html pi.html install.sh; do
            tar -tf pages-artifact/artifact.tar | sed 's|^\./||' | grep -qx "$f"
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist
          if-no-files-found: error
          retention-days: 30

      # Printed before the save so the log shows what each run actually paid
      # for; a warm run reports most objects as hits.
      - name: Report the compiler cache
        if: always()
        run: ccache --show-stats

      # Save even when the build failed: the objects that did compile are valid
      # and the next attempt on this branch should not redo them. Duplicate keys
      # (a re-run of the same commit) are a warning, not a failure, so the save
      # cannot turn a good build red.
      - name: Save the compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-idf-v6.1-${{ github.sha }}

  build-liesa:
    name: Build firmware (self-hosted)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, liesa, esp-idf]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build firmware and check size budgets (native ESP-IDF)
        run: |
          set -euo pipefail
          export IDF_TOOLS_PATH="$HOME/.espressif"
          IDF_DIR="/opt/hostedtoolcache/esp-idf/v6.1"
          # The clone and tool install live in the runner's persistent volumes:
          # the first run pays for them, later runs reuse them. install.sh and
          # the build share this step because PATH changes do not carry across
          # steps.
          #
          # A run cancelled mid-clone (concurrency cancels in progress) leaves a
          # tree that export.sh exists in but that git never finished checking
          # out: the toolchain check below would pass, the build would then fail
          # on a missing file, and every later run would inherit the damage. So
          # validate the tree itself and re-clone through a scratch directory
          # rather than into one that may already be populated.
          idf_tree_ok() {
            [ -f "$IDF_DIR/export.sh" ] &&
              git -C "$IDF_DIR" rev-parse --verify --quiet HEAD >/dev/null 2>&1 &&
              ! git -C "$IDF_DIR" submodule status --recursive 2>/dev/null | grep -q '^-'
          }
          if idf_tree_ok; then
            if ! ( . "$IDF_DIR/export.sh" >/dev/null 2>&1 && \
                   command -v xtensa-esp32-elf-gcc >/dev/null 2>&1 ); then
              echo "ESP-IDF is present but its esp32 tools are not; installing."
              "$IDF_DIR/install.sh" esp32
            fi
          else
            echo "ESP-IDF at $IDF_DIR is missing or incomplete; re-cloning."
            rm -rf "$IDF_DIR.tmp"
            mkdir -p "$(dirname "$IDF_DIR")"
            git clone --depth 1 --branch v6.1 --recursive --shallow-submodules \
              https://github.com/espressif/esp-idf.git "$IDF_DIR.tmp"
            rm -rf "$IDF_DIR"
            mv "$IDF_DIR.tmp" "$IDF_DIR"
            "$IDF_DIR/install.sh" esp32
          fi
          . "$IDF_DIR/export.sh"
          for variant in both left right; do
            python3 tools/firmware/build.py --variant "$variant" --out dist
          done

      - name: List artifacts
        run: ls -lh dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist
          if-no-files-found: error
          retention-days: 30

  package:
    name: Build Pi bridge packages
    # The Pi package version comes from pi/wmr_bridge/__version__, and the build
    # scripts fail unless it equals the repository VERSION. The first step below
    # also fails unless the tag is v plus that same VERSION, so a tag build
    # cannot publish a .deb from a different version. The ESP-IDF build
    # container has no dpkg-deb, hence the separate ubuntu-latest job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The build scripts compare the package version with VERSION, but only
      # the tag tells us which release this is. Without this guard, tagging a
      # tree v0.3.13 while VERSION still says 0.3.12 publishes a .deb whose
      # version disagrees with the firmware tag.
      - name: Check tag matches VERSION
        run: |
          set -eu
          expected="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          fi

      - name: Build tarball, .deb and release installer
        run: |
          pi/build_package.sh --out dist
          pi/build_deb.sh --out dist
          cp pi/install.sh dist/install.sh

      - name: Verify assets and checksums
        run: |
          ls -l dist
          (cd dist && sha256sum -c ./*.sha256)
          test -f dist/install.sh

      - name: Upload Pi bridge packages
        uses: actions/upload-artifact@v7
        with:
          name: pi-package
          path: dist
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-liesa, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The runner workspace is empty apart from the downloaded artifacts, so
      # the checkout is what makes tools/release/make_sums.sh available.
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Download Pi bridge packages
        uses: actions/download-artifact@v8
        with:
          name: pi-package
          path: dist

      # Only nine files are user-facing: the three merged factory images, the
      # three application images the split manifest needs, the Pi .deb, the
      # piped installer and one digest list. Staging into release/ keeps the
      # per-variant bootloader/partition images, manifests, build-info JSON,
      # tarball and per-file .sha256 files out of the release.
      - name: Stage the nine release assets
        run: |
          set -eu
          mkdir -p release
          for variant in "" -left -right; do
            cp "dist/wmr-bridge${variant}-factory.bin" release/
            cp "dist/wmr-bridge${variant}-app.bin" release/
          done
          cp dist/wmr-bridge_*_all.deb release/
          cp dist/install.sh release/
          tools/release/make_sums.sh release
          ls -l release

      # The GitHub release body is the CHANGELOG section for this tag, not
      # GitHub's generated PR list: the caveats (Switch untested on hardware,
      # Pi cannot read FF13 from controllers) must ship with the release.
      - name: Write release body from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## " version " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          test -s release-body.md

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          body_path: release-body.md
          fail_on_unmatched_files: true
          # A tag with a suffix (v0.1.0-rc1) is a prerelease and must not be
          # offered as "Latest"; a plain version tag (v0.1.0) is a release.
          # Without this the action leaves prerelease unset, which GitHub reads
          # as a full release — v0.1.0-rc1 was published that way and had to be
          # corrected by hand.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  pages:
    name: Deploy browser flasher
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-liesa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      # The Pages site is the firmware output directory, so both setup pages
      # and the installer the Pi page links to must be in dist before upload.
      - name: Add the Pi setup page and installer
        run: |
          set -eu
          cp docs/flasher/index.html dist/index.html
          cp docs/flasher/pi.html dist/pi.html
          cp pi/install.sh dist/install.sh
          test -s dist/index.html
          test -s dist/pi.html
          test -s dist/install.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
