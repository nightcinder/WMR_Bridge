name: security

on:
  # Same split as host-tests.yml: branch pushes stay on `main`, so a PR gets
  # one `pull_request` run rather than a second push run beside it.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan of the commits a PR adds (and of a push to `main`). The action
  # is free on a public repository, so no GITLEAKS_LICENSE secret is needed.
  # Report-only until we have a week of noise data: a finding is visible in the
  # checks list but cannot block the merge.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks-action scans a commit range; a shallow clone hides the
          # base commit on a push to `main`.
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis with two registry configs: the language-agnostic security
  # audit and the C rules that match the firmware. `semgrep ci` is deliberately
  # not used because it requires a SEMGREP_APP_TOKEN; `semgrep scan` runs the
  # same rules from the public registry without an account.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
      - name: Scan
        # semgrep exits non-zero when it reports findings, which is expected
        # while the job is report-only. Keep the SARIF step running so the
        # findings are still published as an artifact.
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/security-audit \
            --config p/c \
            --sarif \
            --output semgrep.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
