name: security

on:
  # Same split as host-tests.yml: branch pushes stay on `main`, so a PR gets
  # one `pull_request` run rather than a second push run beside it.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan of the commits a PR adds (and of a push to `main`). The action
  # is free on a public repository, so no GITLEAKS_LICENSE secret is needed.
  # Blocking: a finding fails the job and holds the merge.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks-action scans a commit range; a shallow clone hides the
          # base commit on a push to `main`.
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis with two registry configs: the language-agnostic security
  # audit and the C rules that match the firmware. `semgrep ci` is deliberately
  # not used because it requires a SEMGREP_APP_TOKEN; `semgrep scan` runs the
  # same rules from the public registry without an account.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      # Job-level permissions replace the workflow-level set: `contents` for
      # the checkout, `security-events` for the code-scanning upload below.
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Install semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet semgrep
      - name: Scan
        # `--error` makes semgrep exit 1 when it reports findings, so this job
        # fails and holds the merge. The SARIF step still runs via
        # `if: always()` so the findings stay published as an artifact.
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/security-audit \
            --config p/c \
            --error \
            --sarif \
            --output semgrep.sarif
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 30
      # The artifact is a per-run snapshot; code scanning is the record that
      # keeps state across runs and closes a finding once it is fixed.
      - name: Publish to code scanning
        # Fork PRs cannot receive `security-events: write`, so skip the upload
        # there; a genuine failure in this step must fail the job rather than
        # leave the Security tab silently stale.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
